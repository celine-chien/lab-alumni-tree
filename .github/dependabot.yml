# 依賴套件更新。安全性更新會立刻開 PR；一般版本更新每月一次、合併成一個 PR，避免洗版。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      all-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
